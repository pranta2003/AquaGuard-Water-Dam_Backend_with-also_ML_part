name: AquaGuard Backend & ML CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up Node.js environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'

    # Step 3: Install Node.js dependencies
    - name: Install Node Dependencies
      run: npm install

    # Step 4: Set up Python for the ML engine
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # Step 5: Install Python ML dependencies
    - name: Install Machine Learning Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install scikit-learn pandas

    # Step 6: Verify syntax integrity
    - name: Verify Backend Server Syntax
      run: node --check server.js
